name: release

# Publishes the `sarib` package to PyPI via Trusted Publishing (OIDC) — no stored token.
# Trigger: publishing a GitHub Release. Requires a PyPI pending/trusted publisher registered
# for project `sarib`, owner `SyedSaribSultan`, repo `sarib-lang`, workflow `release.yml`,
# environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch: {}   # allow a manual run from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write     # REQUIRED for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Build distributions
        working-directory: impl        # pyproject.toml lives in impl/
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: impl/dist
