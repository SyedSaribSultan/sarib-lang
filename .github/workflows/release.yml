name: release

# Publishes the `sarib` package to PyPI via Trusted Publishing (OIDC) — no stored token.
# Trigger: publishing a GitHub Release. Requires a PyPI pending/trusted publisher registered
# for project `sarib`, owner `SyedSaribSultan`, repo `sarib-lang`, workflow `release.yml`,
# environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch: {}   # allow a manual run from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write     # REQUIRED for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Build distributions
        working-directory: impl        # pyproject.toml lives in impl/
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: impl/dist
