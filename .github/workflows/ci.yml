name: ci

# The conformance corpus is the project's falsifiable claim: parse -> canon -> surface -> parse
# must round-trip losslessly and be idempotent for every case. Pure Python, zero dependencies,
# so this runs anywhere in seconds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Conformance corpus (round-trip + idempotence)
        working-directory: impl
        run: python tests/run_corpus.py
      # The scale remediation replaced the primitives that supply iteration order, so the
      # golden net pins every projection + all 7 query axes + the op path byte-for-byte.
      # A reordering here is a correctness regression, not a perf change.
      - name: Golden outputs (projections · 7 query axes · op path · permutations)
        run: python impl/tests/run_golden.py
      - name: Deep nesting (recursion is an axis independent of node count)
        run: python impl/tests/test_deep_nesting.py
      - name: Index coherence fuzz (a stale derived index corrupts query results)
        run: python impl/tests/test_index_fuzz.py
      # A whole-document check per op meant one pre-existing violation blocked EVERY edit,
      # including the repair. Op-time validation is now scoped to the touched ids (D-065).
      - name: Op validation is local (a damaged file must still be editable)
        run: python impl/tests/test_op_validation.py
      # The `mcp` SDK requires Python >=3.10, so the containment test can only run there.
      # The core stays 3.9-compatible and is covered by the corpus + CLI steps on every version.
      - name: MCP path containment (must hold under -O, where asserts vanish)
        if: matrix.python-version != '3.9'
        run: |
          pip install "./impl[mcp]"
          python    impl/tests/test_mcp_containment.py
          python -O impl/tests/test_mcp_containment.py
      - name: CLI smoke — the README quickstart, from scratch
        run: |
          pip install ./impl
          printf '# Q3\n\n## Migrate invoices {.task} ^t1\nstatus:: todo\n\nBlocked by [depends-on:: [[Adopt Stripe]]].\n\n## Adopt Stripe {.decision} ^d1\nstatus:: accepted\n' > demo.sarib
          sarib validate demo.sarib
          sarib render   demo.sarib --view outline
          sarib render   demo.sarib --view board
          sarib render   demo.sarib --view mermaid
          sarib query    demo.sarib --type task
          sarib query    demo.sarib --from t1 --edges depends-on
          sarib set      demo.sarib t1 status=done --dry-run
      # The previewer ships in the package so the editor extension can run it from ANY folder
      # (`python -m sarib.preview`) with no checkout. Both entry points are the extension's
      # contract with an installed package — assert them from a neutral cwd, not the repo.
      - name: Previewer smoke — the entry points the editor extension calls
        run: |
          cd "$(mktemp -d)"
          printf '# Q3\n\n## Migrate invoices {.task} ^t1\nstatus:: todo\n' > p.sarib
          sarib-preview p.sarib --stdout            | grep -q "sarib preview"
          python -m sarib.preview - --stdout < p.sarib | grep -q "<!doctype html"

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Real tokenizer (the gate runner aborts rather than estimate)
        run: npm ci   # lockfile-pinned, so the gate's token counts are reproducible
      - name: Programmatic freeze gates (G1, G4, G5, G6, G7, G9)
        run: python bench/run_gates.py
      - name: Fail if any gate regressed
        run: grep -q "ALL PASS" bench/gate-report.md
